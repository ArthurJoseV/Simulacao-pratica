name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Download Biblioteca API
      run: git clone --branch main --single-branch https://github.com/Brencosta/api-testing-playwright.git biblioteca-api
    - name: Install API dependencies
      run: npm ci --prefix biblioteca-api
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium firefox webkit
    - name: Run presentation tests
      run: npm run test:apresentacao
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
